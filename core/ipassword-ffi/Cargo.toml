[package]
name = "ipassword-ffi"
version = "0.1.0"
edition = "2021"
description = "C API for ipassword-core, built as ipassword_core.dll"

[lib]
name = "ipassword_ffi"
crate-type = ["cdylib"]

[dependencies]
ipassword-core = { path = "../ipassword-core" }
serde_json = "1"
zeroize = "1"

[dev-dependencies]
ipassword-core = { path = "../ipassword-core", features = ["insecure-fast-kdf"] }
tempfile = "3"
