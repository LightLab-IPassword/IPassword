[package]
name = "ipassword-core"
version = "0.1.0"
edition = "2021"
description = "Crypto and storage core for IPassword"

[features]
# Enables deliberately weak, fast Argon2 parameters so tests run quickly.
# NEVER enable this in anything you ship or actually store passwords in.
insecure-fast-kdf = []

[dependencies]
aes-gcm = "0.10"
argon2 = { version = "0.5", features = ["zeroize"] }
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
