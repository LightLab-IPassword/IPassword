[package]
name = "ipassword-app"
version = "0.1.0"
edition = "2021"
description = "IPassword desktop app: background hotkeys, capture and paste windows"

[[bin]]
name = "IPassword"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
winapi = { version = "0.3.9", features = ["winuser", "winbase", "winnt", "winreg", "minwindef", "windef", "winerror", "libloaderapi", "errhandlingapi", "synchapi", "shellapi", "wingdi", "handleapi"] }

[dev-dependencies]
tempfile = "3"
