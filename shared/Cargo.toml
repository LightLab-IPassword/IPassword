[package]
name = "ipassword-shared"
version = "0.1.0"
edition = "2021"
description = "Code shared by the Windows and Linux apps: windows (egui), settings, and the core-library loader"

[lib]
name = "ipassword_shared"
path = "src/lib.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "x11"] }
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
